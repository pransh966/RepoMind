<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RepoMind — Chat with your codebase</title>
<style>
  :root { --navy: #1f3864; --bg: #f6f7fb; --border: #d9dce3; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: var(--bg); margin: 0; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px; }
  h1 { color: var(--navy); font-size: 22px; margin-bottom: 4px; }
  .sub { color: #666; font-size: 13px; margin-bottom: 20px; }
  .row { display: flex; gap: 8px; margin-bottom: 24px; }
  input[type=text] { flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
  button { background: var(--navy); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  button:disabled { opacity: 0.5; cursor: default; }
  .answer { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 16px; white-space: pre-wrap; line-height: 1.5; font-size: 14px; }
  .meta { color: #888; font-size: 12px; margin-top: 8px; }
  .citation { background: #fff; border: 1px solid var(--border); border-left: 3px solid var(--navy); border-radius: 6px; padding: 10px 12px; margin-top: 10px; font-size: 12.5px; }
  .citation code { color: var(--navy); font-weight: 600; }
  .citation pre { white-space: pre-wrap; margin: 6px 0 0; font-family: "SF Mono", Consolas, monospace; font-size: 11.5px; color: #333; }
</style>
</head>
<body>
<div class="wrap">
  <h1>RepoMind</h1>
  <div class="sub">Ask a question about the indexed repository. Answers are grounded in retrieved code — every claim is backed by a cited file and line range below.</div>

  <div class="row">
    <input type="text" id="question" placeholder="e.g. How does authentication work in this codebase?" />
    <button id="askBtn" onclick="ask()">Ask</button>
  </div>

  <div id="output"></div>
</div>

<script>
async function ask() {
  const q = document.getElementById('question').value.trim();
  if (!q) return;
  const btn = document.getElementById('askBtn');
  const out = document.getElementById('output');
  btn.disabled = true;
  out.innerHTML = '<div class="answer">Thinking…</div>';

  try {
    const res = await fetch('/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q })
    });
    if (!res.ok) {
      const err = await res.json();
      out.innerHTML = `<div class="answer">Error: ${err.detail || res.statusText}</div>`;
      return;
    }
    const data = await res.json();

    let html = `<div class="answer">${escapeHtml(data.answer)}</div>`;
    html += `<div class="meta">${data.latency_ms} ms · ${data.chunks_considered} chunks retrieved</div>`;
    for (const c of data.citations) {
      html += `<div class="citation"><code>${escapeHtml(c.file)}:${c.start_line}-${c.end_line}</code> (score ${c.score})
        <pre>${escapeHtml(c.snippet)}</pre></div>`;
    }
    out.innerHTML = html;
  } catch (e) {
    out.innerHTML = `<div class="answer">Request failed: ${e}</div>`;
  } finally {
    btn.disabled = false;
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('question').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') ask();
});
</script>
</body>
</html>
